<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Carta digital de Café Nómade: cafés, desayunos, platos y pastelería."
    />
    <title>Café Nómade | Carta digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Café Nómade, ir al inicio">
        <span class="brand-mark" aria-hidden="true">CN</span>
        <span class="brand-name">Café Nómade</span>
      </a>

      <button class="table-button" type="button">
        <span>Mesa</span>
        <strong>08</strong>
      </button>
    </header>

    <main id="inicio" class="page-grid">
      <section class="welcome-panel" aria-labelledby="welcome-title">
        <div class="welcome-copy">
          <p class="eyebrow">Buenos Aires · Desde 2019</p>
          <h1 id="welcome-title">Una pausa rica, estés donde estés.</h1>
          <p>
            Café de especialidad, cocina simple y productos de estación preparados
            en el momento.
          </p>
        </div>

        <div class="service-note">
          <span class="service-dot" aria-hidden="true"></span>
          <span>Cocina abierta hasta las 21:30</span>
        </div>
      </section>

      <section class="menu-section" aria-labelledby="menu-title">
        <div class="menu-heading">
          <div>
            <p class="eyebrow">Nuestra selección</p>
            <h2 id="menu-title">¿Qué vas a pedir?</h2>
          </div>

          <label class="search-box" for="search">
            <span aria-hidden="true">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Buscar en la carta"
              autocomplete="off"
            />
          </label>
        </div>

        <nav class="category-list" aria-label="Categorías de la carta">
          <button class="category-button is-active" type="button" data-category="Todo">Todo</button>
          <button class="category-button" type="button" data-category="Cafés">Cafés</button>
          <button class="category-button" type="button" data-category="Bebidas frías">Bebidas frías</button>
          <button class="category-button" type="button" data-category="Desayunos">Desayunos</button>
          <button class="category-button" type="button" data-category="Platos">Platos</button>
          <button class="category-button" type="button" data-category="Dulces">Dulces</button>
        </nav>

        <div class="product-grid" id="product-list"></div>
      </section>
    </main>

    <aside class="order-bar" aria-label="Resumen del pedido">
      <div class="order-copy">
        <span class="order-count" id="order-count">0</span>
        <span>
          <small>Tu pedido</small>
          <strong id="order-summary">Todavía está vacío</strong>
        </span>
      </div>
      <button id="view-order" type="button" disabled>Ver pedido</button>
    </aside>

    <script src="js/productos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
